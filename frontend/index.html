<!doctype html>
<html lang="zh-CN" data-site-name="演示库" data-site-favicon="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="/static/components/scrollbars.css" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <title>演示库</title>
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="stylesheet" href="/static/components/loading.css" />
    <link rel="stylesheet" href="/static/components/select.css" />
    <link rel="stylesheet" href="/static/settings.css" />
    <link rel="stylesheet" href="/static/editor/visual.css" />
    <link rel="stylesheet" href="/static/theme.css" />
    <link rel="stylesheet" href="/static/components/toast.css" />
    <link rel="stylesheet" href="/static/katex/katex.min.css" />
  </head>
  <body>
    <div id="app">
      <div class="app-loading" role="status" aria-label="正在加载">
        <div class="loading-brand">
          <img src="/static/favicon.svg" alt="" />
          <div class="loading-track"><i></i></div>
        </div>
      </div>
    </div>
    <div id="toast" role="status"></div>
    <dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
    <input
      id="importFile"
      type="file"
      accept=".zip,.html,.htm,.json,.pptx,.ppt"
      hidden
    />
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
