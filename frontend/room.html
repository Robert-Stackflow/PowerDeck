<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link rel="stylesheet" href="/static/components/scrollbars.css" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <title>房间</title>
    <link rel="stylesheet" href="/static/player/shell.css" />
    <link rel="stylesheet" href="/static/components/loading.css" />
    <link rel="stylesheet" href="/static/player/room.css" />
  </head>
  <body>
    <div id="loading" role="status" aria-label="正在加入房间">
      <div class="loading-brand">
        <img src="/static/favicon.svg" alt="" />
        <div class="loading-track"><i></i></div>
      </div>
    </div>
    <div id="roomStatus" aria-live="polite">
      <i></i><span>正在连接房间</span>
    </div>
    <main id="roomJoin" class="room-join" hidden>
      <form id="roomJoinForm">
        <span class="room-join-icon" aria-hidden="true">◎</span>
        <p>加入房间</p>
        <h1 id="roomJoinTitle">房间</h1>
        <label
          >你的称呼<input
            name="name"
            maxlength="40"
            autocomplete="nickname"
            placeholder="例如：小林"
            required
        /></label>
        <label id="roomPasswordField" hidden
          >房间密码<input
            name="password"
            type="password"
            maxlength="128"
            autocomplete="current-password"
            placeholder="输入房主设置的密码"
        /></label>
        <output id="roomJoinError"></output>
        <button type="submit">进入房间</button>
      </form>
    </main>
    <iframe
      id="playerFrame"
      title="房间"
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"
      allow="fullscreen"
      hidden
    ></iframe>
    <main id="error" hidden>
      <div id="errorIcon"></div>
      <h1 id="errorTitle">无法加入房间</h1>
      <p id="errorMessage"></p>
      <a href="/">返回演示库</a>
    </main>
    <script type="module" src="/static/player/room-loader.js"></script>
  </body>
</html>
