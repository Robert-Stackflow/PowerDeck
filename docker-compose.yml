services:
  powerdeck:
    build:
      context: /home/repos/PowerDeck
      dockerfile: Dockerfile
    image: ruida/powerdeck:latest
    container_name: powerdeck
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      TZ: Asia/Shanghai
      EXPORT_CHROMIUM_PATH: /usr/bin/chromium
      SOFFICE_PATH: /usr/bin/soffice
    ports:
      - "127.0.0.1:3015:4173"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get({host:'127.0.0.1',port:4173,path:'/api/session',headers:{Host:new URL(process.env.PUBLIC_URL).host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
